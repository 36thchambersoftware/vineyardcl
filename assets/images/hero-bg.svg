<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Warm welcoming church background</title>
  <desc id="desc">Abstract modern background for the church homepage hero section.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#203346"/>
      <stop offset="100%" stop-color="#475f7a"/>
    </linearGradient>
    <radialGradient id="g2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f6d7a9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f6d7a9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="260" cy="150" r="140"/>
    <circle cx="1420" cy="220" r="180"/>
    <circle cx="1180" cy="740" r="240"/>
