<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vineyard Christian Church of Crystal Lake</title>
  <desc id="desc">Social sharing card with service information and welcoming message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2d3d"/>
      <stop offset="100%" stop-color="#344f6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="180" fill="#b58e57" fill-opacity="0.24"/>
