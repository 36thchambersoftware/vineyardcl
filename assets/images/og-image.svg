  <text x="90" y="210" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Vineyard Christian Church</text>
  <text x="90" y="275" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Crystal Lake, IL</text>
  <text x="90" y="365" fill="#d9e2ec" font-family="Arial, Helvetica, sans-serif" font-size="34">Sunday service at 10:30 AM</text>
